name: CI/CD

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t ngo-ccsh-backend .

      - name: Run tests inside container
        run: |
          docker run \
            -e DB_USERNAME=DONTCARE \
            -e DB_PASSWORD=DONTCARE \
            -e DB_HOST=DONTCARE \
            -e DB_PORT=DONTCARE \
            -e DB_DATABASE=DONTCARE \
            -e DB_SCHEMA=DONTCARE \
            -e DJANGO_SETTINGS_MODULE=ngo_ccsh.test_settings \
            ngo-ccsh-backend \
            python manage.py test


name: Lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar ferramentas de lint
        run: pip install pylint pylint-django flake8 black

      - name: Rodar black --check
        run: black --check .

      - name: Rodar flake8
        run: flake8 . --select=E9,F63,F7,F82 --extend-ignore=F821

      - name: Rodar pylint
        env:
          DJANGO_SETTINGS_MODULE: ngo_ccsh.test_settings
          DJANGO_SECRET_KEY: lint-secret-key
          JWT_SIGNING_KEY: lint-secret-key
        run: |
          find . -name "*.py" -not -path "*/migrations/*" -not -path "*/venv/*" | xargs pylint --errors-only
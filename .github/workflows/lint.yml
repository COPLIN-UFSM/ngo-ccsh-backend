name: Lint

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Faz checkout do repositório
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar variáveis de ambiente
        run: cp .env.example .env

      - name: Verifica qualidade do código com black
        run: black --check .

      - name: Verifica qualidade do código com Ruff
        run: ruff check . --output-format=github

      - name: Verifica qualidade do código com pylint
        env:
          DJANGO_SETTINGS_MODULE: ngo_ccsh.test_settings
          DJANGO_SECRET_KEY: lint-secret-key
          JWT_SIGNING_KEY: lint-secret-key
        run: pylint --recursive=y --errors-only --django-settings-module=ngo_ccsh.test_settings .
name: Lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar ferramentas de lint
        run: pip install pylint pylint-django flake8 black

      - name: Rodar black --check
        run: black --check .

      - name: Rodar flake8
        run: flake8 .

      - name: Rodar pylint
        run: |
          find . -name "*.py" -not -path "*/migrations/*" -not -path "*/venv/*" | xargs pylint